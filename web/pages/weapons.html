<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>武器流派 — 勇者之魂</title>
  <meta name="description" content="勇者之魂十種武器流派：劍弓法拳斧鎚槍銃鏢晶。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <script src="../config.js"></script>
</head>
<body data-page="weapons">
  <header class="page-hero" style="--hero-img:url('../media/gemini/keyart_weapons.png')">
    <div class="container">
      <div class="breadcrumb"><a href="../index.html">首頁</a> / 武器流派</div>
      <h1>十種武器流派</h1>
      <p>選的是<strong>武器手感</strong>，不是鎖死職業。可與器／魂／招並存；旅途中也能換流派。</p>
    </div>
  </header>
  <main class="page">
    <div class="container">
      <h2 class="section-h2"><span class="accent"></span><span>和養成怎麼疊？</span></h2>
      <div class="panel" style="margin-bottom:1.5rem">
        <table>
          <thead><tr><th>系統</th><th>作用</th></tr></thead>
          <tbody>
            <tr><td><strong>武器流派</strong></td><td>劍／弓／法／拳／斧／鎚／槍／銃／鏢／水晶 — 手感與被動</td></tr>
            <tr><td><strong>器</strong></td><td>鐵匠鍛造、升階、裝備素質</td></tr>
            <tr><td><strong>魂</strong></td><td>觀星凝出戰魂，各有偏重的屬性，可以拆下來換</td></tr>
            <tr><td><strong>招</strong></td><td>技能習得與熟練升級</td></tr>
          </tbody>
        </table>
      </div>

      <h2 class="section-h2"><span class="accent"></span><span>流派一覽</span></h2>
      <p class="section-sub">遊戲內鍛造後可選擇</p>
      <div class="weapon-grid" id="weapon-grid">
        <p class="muted">載入中…</p>
      </div>
    </div>
  </main>
  <script src="../js/site.js"></script>
  <script>
    fetch("../data/weapon_classes.json")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var root = document.getElementById("weapon-grid");
        root.innerHTML = "";
        (data.classes || []).forEach(function (c) {
          var card = document.createElement("article");
          card.className = "weapon-card";
          card.style.borderTop = "3px solid " + (c.color || "#c25e73");
          var pros = (c.pros || []).map(function (p) { return "<li>" + p + "</li>"; }).join("");
          var cons = (c.cons || []).map(function (p) { return "<li>" + p + "</li>"; }).join("");
          card.innerHTML =
            '<div class="icon-row">' +
              '<div class="icon" style="background:' + (c.color || "#eee") + '22;display:grid;place-items:center;font-size:1.4rem;font-weight:800;color:' + (c.color || "#333") + '">' + (c.name || "?") + "</div>" +
              "<div><h3>" + c.name + " · " + c.title + "</h3>" +
              '<p class="tagline">' + (c.tagline || "") + "</p></div></div>" +
            '<p class="muted" style="margin:0">玩法：' + (c.play || "") + "</p>" +
            '<div class="split">' +
              '<div><strong class="tag tag-pro">優點</strong><ul>' + pros + "</ul></div>" +
              '<div><strong class="tag tag-con">缺點</strong><ul>' + cons + "</ul></div>" +
            "</div>";
          root.appendChild(card);
        });
      })
      .catch(function () {
        document.getElementById("weapon-grid").innerHTML =
          '<p class="msg err">無法載入流派資料。請確認 <code>web/data/weapon_classes.json</code> 存在。</p>';
      });
  </script>
</body>
</html>
