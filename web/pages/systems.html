<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>養成 — 勇者之魂</title>
  <meta name="description" content="勇者之魂：器、魂、招，三條能同時養的線。" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <script src="../config.js"></script>
</head>
<body data-page="systems">
  <header class="page-hero" style="--hero-img:url('../media/gemini/keyart_soul.png')">
    <div class="container">
      <div class="breadcrumb"><a href="../index.html">首頁</a> / 養成</div>
      <h1>器 · 魂 · 招</h1>
      <p><strong>鐵匠養器 · 觀星養魂 · 旅途養招</strong>。與武器流派正交，可自由疊加。</p>
    </div>
  </header>
  <main class="page">
    <div class="container">
      <div class="sys-grid">
        <article class="sys-card">
          <img src="../media/gemini/keyart_forge.png" alt="鐵匠鍛造" />
          <div class="body">
            <h3>器 · 鍛造升階</h3>
            <p>找<strong>釘釘</strong>鍛造武器。材料來自野外掉落與<strong>琥珀材料行</strong>；失敗不會掉階。</p>
          </div>
        </article>
        <article class="sys-card">
          <img src="../media/gemini/keyart_starfall.png" alt="星途觀星" />
          <div class="body">
            <h3>魂 · 星途觀星</h3>
            <p>路上收集<strong>星屑</strong>，找<strong>星讀</strong>舉行觀星，獲得可嵌可拆的戰魂，調整暴擊、攻防等傾向。</p>
          </div>
        </article>
        <article class="sys-card">
          <img src="../media/gemini/keyart_leo.png" alt="旅途養招" />
          <div class="body">
            <h3>招 · 技能熟練</h3>
            <p>戰鬥與演武場累積熟練、自動升級。不同武器流派會解鎖對應招式線。</p>
          </div>
        </article>
      </div>

      <h2 class="section-h2" style="margin-top:2rem"><span class="accent"></span><span>怎麼一起用？</span></h2>
      <div class="panel">
        <p>例如：選<strong>弓</strong>（遠距）＋戰魂偏暴擊＋鍛造升階＋提升招式熟練。之後換槍，戰魂仍可拆到新武器上。</p>
        <p style="margin-bottom:0"><a class="btn btn-primary" href="weapons.html">看十種武器流派</a></p>
      </div>
    </div>
  </main>
  <script src="../js/site.js"></script>
</body>
</html>
